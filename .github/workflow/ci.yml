name: CI

on:
  push:
    branches:
    - main
pull_request:
  branches:
    - main

jobs:
  build-test:
    runs-on: ubuntu-latest

steps:
  # 9. Récupérer le code
  - name: Checkout code
    uses: actions/checkout@v4

  # 10. Installer Node.js
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  # 11. Installer les dépendances de l'API
  - name: Install API dependencies
    working-directory: ./api
    run: npm ci

  # 12. Lancer les tests API
  - name: Run API tests
    working-directory: ./api
    run: npm test

  # 13. Construire l'image Docker de l'API
  - name: Build API Docker image
    run: docker build -t api-image ./api

  # 14. Construire l'image Docker du frontend
  - name: Build Frontend Docker image
    run: docker build -t frontend-image ./frontend
```
